name: Android APK Build
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check uploaded archive
        run: |
          find . -maxdepth 2 -type f -name '*.zip' -print
          test -n "$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
